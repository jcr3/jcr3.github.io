<!DOCTYPE html>
<html lang="">
	<head>
		<meta charset="UTF-8">
		<link rel="icon" href="/favicon.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>JC3</title>
		<script type="module" crossorigin src="/index.js"></script>
		<link rel="stylesheet" crossorigin href="/main.css">
	</head>
	<body>
		<div id="bg">
			<div style="
				overflow: hidden;
				position: absolute;
				inset: 0;"
			>
        		<pre id="bg-text" class="crt"></pre>
      		</div>
      		<div id="grad"></div>
      		<div id="fg-container">
        		<img id="artwork" class="pixel-art" src="/assets/pixel3.gif">
        		<img id="frame" class="pixel-art" src="/assets/pixel3f.png">
				<img id="guy" class="pixel-art" src="/assets/guy.gif"
					onclick='alert(`"Stop poking me!"`)'>
				<img id="power-button" class="pixel-art" src="/assets/buttons/front_button.png">
				<div id="content-container" class="crt">
					<div id="first-row">
						<div id="nav-bar">
							<a href="#/blog" onclick="route()" class="button-container">
								<img class="pixel-art button" src="/assets/buttons/red_button.png">
								<p class="button-text">Blog</p>
							</a>
							<a href="https://portfolio.jc3.red" target="_blank" class="button-container">
								<img class="pixel-art button" src="/assets/buttons/purple_button.png">
								<p class="button-text">Portfolio↗</p>
							</a>
							<a href="https://jc3.kit.com/profile" target="_blank" class="button-container">
								<img class="pixel-art button" src="/assets/buttons/green_button.png">
								<p class="button-text">News Letter↗</p>
							</a>
							<a href="#/contact" onclick="route()" class="button-container">
								<img class="pixel-art button" src="/assets/buttons/yellow_button.png">
								<p class="button-text">Contact</p>
							</a>
							<a href="#/links" onclick="route()" class="button-container">
								<img class="pixel-art button" src="/assets/buttons/blue_button.png">
								<p class="button-text">Links</p>
							</a>
							<div style="display: flex; flex-direction: row; justify-content: end; align-items: center;">
								<a id="home-button"
								   href="#/" onclick="route()"
								   style="font-size: min(2.5vw, 21px); text-decoration: none;"
								>
								   家
								</a>
								<p id="fullscreen-button">⛶</p>
								<p id="pop-button">↗</p>
							</div>
						</div>
						<iframe src="/pages/welcome.html" id="content" class="page start-flicker">
						</iframe>
					</div>
					<div id="second-row">
						<iframe src="https://www5.cbox.ws/box/?boxid=962189&boxtag=xVwRp3" id="chat-room" class="page start-flicker"></iframe>
					</div>
				</div>
			</div>
    	</div>
		<script src="router.js"></script>
  	</body>
</html>
