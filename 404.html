<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <script type="text/javascript">
      // Redirect to hash routes
      switch (window.location.href) {
        case ('/blog'): window.location.href = "/#/blog";
        case ('/artworks'): window.location.href = "/#/artworks";
        case ('/projects'): window.location.href = "/#/projects";
        case ('/archive'): window.location.href = "/#/archive";
        case ('/links'): window.location.href = "/#/links";
        default: window.location.href = "/#/404";
      }
    </script>
  </head>
  <body>
    <p>Redirecting to the 404 page...</p>
  </body>
</html>
