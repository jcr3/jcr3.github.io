<!DOCTYPE html>
<html lang="">
	<head>
		<meta charset="UTF-8">
		<link rel="icon" href="/favicon.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Blog</title>
		<link rel="stylesheet" crossorigin href="/main.css">
		<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
		<script>
			function toggleNavbar() {
				const navBar = document.getElementById("blog-nav");
				if (navBar.style.display == 'flex') {
					navBar.style.display = 'none';
				} else {
					navBar.style.display = 'flex';
				}
			}
			function monthExpander(month) {
				let monthExapnded
				switch (month) {
					case ('01'): monthExapnded = 'January'; break;
					case ('02'): monthExapnded = 'February'; break;
					case ('03'): monthExapnded = 'March'; break;
					case ('04'): monthExapnded = 'April'; break;
					case ('05'): monthExapnded = 'May'; break;
					case ('06'): monthExapnded = 'June'; break;
					case ('07'): monthExapnded = 'July'; break;
					case ('08'): monthExapnded = 'August'; break;
					case ('09'): monthExapnded = 'September'; break;
					case ('10'): monthExapnded = 'October'; break;
					case ('11'): monthExapnded = 'November'; break;
					case ('12'): monthExapnded = 'December'; break;
				}
				return monthExapnded
			}
			document.addEventListener("DOMContentLoaded", () => {
				const pageNumEl = document.getElementById('page-num');
				const prevEl = document.getElementById('prev');
				const nextEl = document.getElementById('next');
				const navBar = document.getElementById("nav-items");
				const blogContent = document.getElementById("blog-content");
				const pageContent = document.getElementById("page-content");
				const pages = [[]];
				const maxPostsOnPage = 3;
				let currentPage = 0;

				function navToPost(pageNum, id, toggleNav=true) {
					if (currentPage != pageNum) {
						showPage(pageNum);
					}
					const post = document.getElementById(id);
					pageContent.scrollTo({
						top: post.getBoundingClientRect().top -
							 pageContent.getBoundingClientRect().top +
							 pageContent.scrollTop
					});

					if (toggleNav) toggleNavbar();
				}
				window.navToPost = navToPost;

				fetch("blogs/blog_map.json")
				.then((response) => response.json())
				.then((data) => {
					const blog_map = data;
					
					let postCount = 0
					let pageNum = 0
					Object.entries(blog_map)
					.sort(([a], [b]) => Number(b) - Number(a))
					.forEach(([year, months]) => {
						const yearEl = document.createElement("div");
						yearEl.innerText = year;
						yearEl.classList.add("year");
						navBar.appendChild(yearEl);
						Object.entries(months)
						.sort(([a], [b]) => Number(b) - Number(a))
						.forEach(([month, days]) => {
							const monthEl = document.createElement("div");
							monthEl.innerText = monthExpander(month);
							monthEl.classList.add("month");
							yearEl.appendChild(monthEl);
							Object.entries(days)
							.sort(([a], [b]) => Number(b) - Number(a))
							.forEach(([day, post_info]) => {
								const shareLink = document.createElement("a");
								shareLink.innerText = 'Share ⧉';
								shareLink.classList.add("share-link");
								shareLink.onclick = () => {
									navigator.clipboard.writeText(`https://jc3.red/#/blog/${pageNum}-${year}-${month}-${day}`);
									alert(`Copied link: https://jc3.red/#/blog/${pageNum}-${year}-${month}-${day}`);
								}

								// nav bar
								const postNavEl = document.createElement("p");
								postNavEl.innerText = post_info.title;
								postNavEl.onclick = navToPost.bind(postNavEl, pageNum, `${year}-${month}-${day}`);
								postNavEl.classList.add("post-nav");

								monthEl.appendChild(postNavEl);

								const postEl = document.createElement("div");
								postEl.classList.add("post");
								postEl.id = `${year}-${month}-${day}`;
								blogContent.appendChild(postEl);

								// store page structure
								pages[pageNum].push(`${year}-${month}-${day}`);
								postCount = postCount + 1;
								if (postCount == maxPostsOnPage) {
									pageNum = pageNum + 1;
									pages.push([])
									postCount = 0;
								}

								// post
								fetch(`blogs/${post_info.path}`)
								.then((response) => response.text())
								.then((data) => {
									postEl.innerHTML = marked.parse(data);
									postEl.innerHTML += "<br>"
									postEl.appendChild(shareLink);
								})
							});
						});
					});
					// clean up if num of posts is divisible by num of posts on a page
					if (pages[pages.length - 1].length == 0) {
						pages.pop();
					}
					showPage(0);
				})
				.then(() => {
					setTimeout(() => {
						window.parent.postMessage({ type: "blog-ready" }, "*");
					}, 100);
				})
				.catch((error) => console.error("could not load blogs"));

				function showPage(pageNum) {
					Object.entries(pages).forEach(([index, ids]) => {
						if (index != pageNum) {
							ids.forEach((id) => {
								post = document.getElementById(id);
								post.style.display = 'none';
							});
						} else {
							ids.forEach((id) => {
								post = document.getElementById(id);
								post.style.display = 'inline';
							});
						}
					});
					currentPage = pageNum;

					pageNumEl.innerText = `| ${currentPage + 1} |`;

					if (pages.length == 1) {
						prevEl.classList.add('unactive-link');
						nextEl.classList.add('unactive-link');
					}
					else if (currentPage == 0) {
						prevEl.classList.add('unactive-link');
						nextEl.classList.remove('unactive-link');
					}
					else if (currentPage == pages.length - 1) {
						prevEl.classList.remove('unactive-link');
						nextEl.classList.add('unactive-link');
					}
					else {
						prevEl.classList.remove('unactive-link');
						nextEl.classList.remove('unactive-link');
					}
				}

				function prevPage() {
					if (currentPage > 0) {
						currentPage = currentPage - 1;
						showPage(currentPage);
					}
				}

				function nextPage() {
					if (currentPage < pages.length - 1) {
						currentPage = currentPage + 1;
						showPage(currentPage);
					}
				}

				prevEl.onclick = prevPage;
				nextEl.onclick = nextPage;
			});
		</script>
	</head>
	<body>
		<div class="page">
			<div id="blog-nav" 
			     style="
					display: none;
					flex-direction: column;
					position: fixed;
					top: 0; right: 0;
					z-index: 1;
					text-align: left;
					background-color: rgb(204, 214, 238);
					border-left: 1px solid black;
					height: 100vh;
					min-width: 15vw;
					max-width: 70vw;
					padding-right: 4px;
				"
			>
				<p class="blog-nav-button"
				   style="font-size: 20px; width: 100%; text-align: right;"
				   onclick="toggleNavbar()"
				>
				   x
				</p>
				<div id="nav-items" style="
					height: 100%; width: 100%; overflow-y: auto; 
					overflow-x: hidden; padding: 0 8px 0 8px;"
				>
				</div>
			</div>
			<div id="title-bar"
				style="
					display: flex;
					width: 100%;
					height: 28px;
					padding-bottom: 2px;
					border-bottom: 1px solid black;
					background-color: rgb(204, 214, 238);
				">
				<h2 style="flex: 1 1 auto; margin: 0;">
                	JC3'S BLOG
            	</h2>
				<h2 class='blog-nav-button' onclick="toggleNavbar()">
					+
				</h2>
			</div>
			<div id="page-content" class="page-content"
				style="
					text-align: left; width: calc(100% - 8px);
					height: calc(100% - 30.8px - 8px); overflow-y: auto; overflow-x: hidden;"
			>
				<div id="blog-content">
				</div>
				<div style="width: 100%; display: flex; justify-content: center; gap: 8px;">
					<p id="prev"
						class="share-link"
						style="cursor: pointer;"
					>&lt&lt prev</p>
					<p id="page-num"
						style="font-size: 12px; text-decoration: none;
							color: rgba(0,0,255,0.5); cursor: default;"
					>| 1 |</p>
					<p id="next"
						class="share-link"
						style="cursor: pointer;"
					>next &gt&gt</p>
				</div>
			</div>
        </div>
  	</body>
</html>
